<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div class="box">
<h1>Expense Tracker</h1>
<input type="text" id="name" placeholder="Expense name">
<input type="number" id="amount" placeholder="Amount">
<select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Other</option></select>
<button onclick="addExpense()">Add Expense</button>
<p id="error"></p>
Filter: <select id="filter" onchange="show()"><option>All</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Other</option></select>
<ul id="list"></ul>
<h3>Total: Rs <span id="total">0</span></h3>
</div>
<script src="lab.js"></script>
</body>
</html>
